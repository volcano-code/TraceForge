name: traceforge-promote-reviewed-lock
on:
  push:
    branches: ['chore/promote-reviewed-lock-20261009']
    paths: ['.github/workflows/promote-reviewed-lock.yml']
permissions:
  contents: read
jobs:
  promote-two-public-json-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Fetch prior public dependency-resolution artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-remediation-evidence
          run-id: 37736867506
          repository: volcano-code/TraceForge
          github-token: ${{ github.token }}
          path: dependency-evidence
      - name: Verify exact two files and create immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          expected = {
            'package.json': ('e22e19339d84b9d3ab85dfc817632802cea716eec8b025c2fb0470f5a7d24ce0', '4dfc23ad8891b68319427bd2380e616912f24ac1'),
            'package-lock.json': ('4fc633f3fd2f10440b67afa7046dce4b4ee24fce47295cf072f4049d4b2e7816', '1a46625581d9b01aa273ac9ff35d6ef371de0995'),
          }
          result = {}
          for name, (checksum, git_sha) in expected.items():
              path = pathlib.Path('dependency-evidence') / name
              assert path.is_file() and not path.is_symlink()
              raw = path.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == checksum, name
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == git_sha
              content = raw.decode('utf-8')
              assert isinstance(json.loads(content), dict)
              body = json.dumps({'content': content, 'encoding': 'utf-8'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/volcano-code/TraceForge/git/blobs',
                  data=body, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              assert blob['sha'] == git_sha
              result[name] = {'sha256': checksum, 'git_blob_sha': git_sha, 'bytes': len(raw)}
          # No branch update, checkout, model, dependency install or candidate execution.
          pathlib.Path('promotion-result.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-dependency-blob-identities
          path: promotion-result.json
          retention-days: 14
