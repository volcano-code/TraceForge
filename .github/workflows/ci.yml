name: traceforge-quality-gates
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: traceforge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q --junitxml=reports/ci/python.xml
        env: {PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'}
      - run: node --test tests-js/*.test.mjs
      - run: python scripts/http_smoke_m1.py
      - run: python scripts/reliability_demo.py --output reports/ci/reliability
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-evidence, path: reports/ci}
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -e '.[test]'
        working-directory: .
      - name: Install (first successful resolution produces the reviewed lockfile)
        run: if test -f package-lock.json; then npm ci; else npm install; fi
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: {CI: 'true'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence-and-lock
          path: |
            frontend/package-lock.json
            frontend/test-results
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: traceforge, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: traceforge}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U traceforge -d traceforge"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -e '.[test,postgres]'
      - run: python -m pytest tests_live/test_postgres_gate.py -q --junitxml=reports/ci/postgres.xml
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          TF_TEST_POSTGRES_URL: postgresql+psycopg://traceforge:ci-only-password@127.0.0.1:5432/traceforge
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: postgres-evidence, path: reports/ci}
