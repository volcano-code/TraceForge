name: traceforge-frontend-dependencies
on:
  push:
    branches: ['chore/sdk-environment-probe-20261005']
    paths: ['.github/workflows/frontend-dependencies.yml']
  pull_request:
    paths: ['.github/workflows/frontend-dependencies.yml']
permissions:
  contents: read
concurrency:
  group: frontend-dependencies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare isolated dependency-only upgrade; no local product source or credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-evidence candidate-dependencies
          cp frontend/package.json candidate-dependencies/
          cp frontend/package-lock.json candidate-dependencies/
          sha256sum frontend/package-lock.json > dependency-evidence/baseline-lock.sha256
          node <<'JS'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('candidate-dependencies/package.json','utf8'));
          p.devDependencies.vitest='4.1.11';
          p.overrides={...(p.overrides||{}),'source-map-js':'1.2.2'};
          fs.writeFileSync('candidate-dependencies/package.json',JSON.stringify(p,null,2)+'\n');
          JS
          (cd candidate-dependencies && npm install --package-lock-only --ignore-scripts --no-audit --no-fund) > dependency-evidence/resolve.log 2>&1
          (cd candidate-dependencies && npm ci --no-audit --no-fund) > dependency-evidence/npm-ci.log 2>&1
          cp candidate-dependencies/package*.json dependency-evidence/
          node --version > dependency-evidence/node-version.txt
          npm --version > dependency-evidence/npm-version.txt
          tar -czf dependency-evidence/node-modules-linux-x64.tar.gz -C candidate-dependencies node_modules
          (cd dependency-evidence && sha256sum package.json package-lock.json node-modules-linux-x64.tar.gz > SHA256SUMS)
      - name: Record complete and production audits; do not suppress failed results
        if: success()
        shell: bash
        run: |
          set +e
          (cd candidate-dependencies && npm audit --json) > dependency-evidence/audit-full.json 2> dependency-evidence/audit-full.stderr
          printf '%s\n' "$?" > dependency-evidence/audit-full.exit
          (cd candidate-dependencies && npm audit --omit=dev --json) > dependency-evidence/audit-production.json 2> dependency-evidence/audit-production.stderr
          printf '%s\n' "$?" > dependency-evidence/audit-production.exit
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-remediation-evidence
          path: |
            dependency-evidence/*.json
            dependency-evidence/*.log
            dependency-evidence/*.txt
            dependency-evidence/*.exit
            dependency-evidence/*.stderr
            dependency-evidence/*.sha256
            dependency-evidence/SHA256SUMS
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-remediation-dependencies
          path: dependency-evidence/node-modules-linux-x64.tar.gz
          retention-days: 3
          compression-level: 0
      - name: Require both recorded audits to pass
        shell: bash
        run: |
          test "$(cat dependency-evidence/audit-full.exit)" = 0
          test "$(cat dependency-evidence/audit-production.exit)" = 0
