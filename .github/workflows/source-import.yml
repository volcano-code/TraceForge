name: traceforge-one-time-source-import
on:
  push:
    branches: ['fix/m2-hardening-20260929']
    paths: ['.transport/**']
permissions:
  contents: write
concurrency:
  group: traceforge-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'volcano-code/TraceForge' && github.ref == 'refs/heads/fix/m2-hardening-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m2-hardening-20260929
          fetch-depth: 1
      - name: Verify and materialize source without running product code
        run: python3 .transport/import_source.py
      - name: Remove transfer files and commit individual source files
        run: |
          git rm -r -- .transport
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: import verified TraceForge M2 hardening source and regression tests'
          git push origin HEAD:refs/heads/fix/m2-hardening-20260929
      - uses: actions/upload-artifact@v4
        with:
          name: source-import-manifest
          path: source-import-manifest.json
