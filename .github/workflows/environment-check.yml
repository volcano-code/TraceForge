name: traceforge-environment-check
on:
  push:
    branches: ['fix/m2-hardening-20260929']
    paths: ['.github/workflows/environment-check.yml']
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Package registry reachability
        run: |
          python --version
          node --version
          npm view react version
          python -m pip index versions fastapi
