[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
version = "0.3.1.dev0"
description = "M1 audited control plane and M2-start reviewed execution boundaries"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2", "pydantic==2.13.4", "pydantic-settings==2.14.1",
  "SQLAlchemy==2.0.50", "alembic==1.18.4", "uvicorn==0.48.0",
  "python-dotenv==1.2.2",
]
[project.optional-dependencies]
browser = ["playwright==1.57.0"]
test = ["pytest==9.0.2", "pytest-cov==7.0.0", "httpx==0.28.1"]
postgres = ["psycopg[binary]>=3.2,<4"]
[project.scripts]
traceforge = "traceforge.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
traceforge = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
[tool.coverage.run]
source = ["traceforge"]
omit = ["*/cli.py", "*/worker.py"]
